<script>
const PH=(k,pos,extra)=>`<img src="img/${k}.jpg" style="object-position:${pos||'50% 50%'};${extra||''}">`;
const SH='<div class="shade" style="background:linear-gradient(180deg, rgba(7,13,36,.3) 0%, rgba(7,13,36,.3) 34%, rgba(7,13,36,.72) 50%, rgba(7,13,36,.92) 64%, rgba(7,13,36,.96) 100%)"></div>';
const S=[];
// 1 capa
S.push({h:`<div class="bg">${PH('marcus','50% 18%')}</div>${SH}
 <div class="page end"><div class="keytag"><div class="k">🔑</div><div class="str"></div><div class="tag">IBS + CBS</div></div>
 <h1 style="font-size:78px">Vai ter imposto novo <em>sobre o seu aluguel?</em></h1>
 <p style="font-size:33px">A reforma tributária mudou as regras de quem aluga imóvel como pessoa física. Para a maioria, nada muda. <b class="g">Para alguns, 2027 já começa diferente.</b> 👉</p></div>`});
// 2 quem paga
S.push({light:1, h:`<div class="page"><div class="pill">Quem passa a pagar</div>
 <h2 style="font-size:54px">Você só entra na regra se tiver <em>as DUAS condições</em> ao mesmo tempo</h2>
 <div class="cond"><div><div class="v">+ de 3</div><div class="t">imóveis alugados</div></div><div class="plus">+</div><div><div class="v">+ R$ 240 mil</div><div class="t">de aluguel recebido no ano</div></div></div>
 <p style="font-size:31px">Se tiver só uma das duas, você <b>não paga IBS e CBS</b>. Continua pagando apenas o Imposto de Renda, como hoje.</p>
 <div class="warn">⚠️ <b>Trava no meio do ano:</b> se o aluguel recebido passar de <b>R$ 288 mil</b>, você já entra na regra no mesmo ano.</div></div>`});
// 3 detalhes
S.push({h:`<div class="page"><div class="pill">Os detalhes que pegam muita gente</div>
 <h2 style="font-size:58px">3 pontos que <em>pouca gente está olhando</em></h2>
 <div class="pts">
  <div class="p"><div class="n">1</div><div class="t">O que você recebe em <b>2026</b> define a sua situação em <b>2027</b>. <b class="g">A conta já começou.</b></div></div>
  <div class="p"><div class="n">2</div><div class="t">O <b>casal não soma</b> os imóveis. Cada cônjuge é analisado sozinho, pela parte que tem em cada imóvel.</div></div>
  <div class="p"><div class="n">3</div><div class="t">O limite de R$ 240 mil é corrigido pelo <b>IPCA</b>, mas o aluguel costuma subir mais que a inflação. Com o tempo, <b class="g">mais gente tende a passar do limite</b> sem ter comprado nenhum imóvel novo.</div></div>
 </div></div>`});
// 4 quanto custa
S.push({light:1, h:`<div class="page"><div class="pill">Quanto custa para quem entrar</div>
 <h2 style="font-size:56px">Aluguel tradicional x Airbnb: <span class="r">a carga dobra</span></h2>
 <div class="cmp2"><div><div class="ic">🏠</div><div class="k">Longo prazo</div><div class="v" style="color:#0e1f5b">≈ 3,4%</div><div class="d">E ainda tem um <b>desconto de R$ 600 por mês</b> em cada imóvel residencial, que reduz a base do imposto.</div></div>
  <div style="border-color:var(--red); background:rgba(227,20,30,.05)"><div class="ic">🧳</div><div class="k">Temporada (até 90 dias)</div><div class="v" style="color:var(--red)">≈ 6,8%</div><div class="d">Como no Airbnb: segue a <b>regra de hotel</b>.</div></div></div>
 <div class="note2">Estimativa para 2027, a partir do cálculo do TCU. O Imposto de Renda continua sendo cobrado normalmente.</div>
 <div class="pin">📌 Quem tem até 3 imóveis, ou recebe menos de R$ 240 mil por ano, <b>continua fora da regra</b>, mesmo anunciando em aplicativo.</div></div>`});
// 5 soluções PF
S.push({h:`<div class="page" style="padding-top:120px; padding-bottom:140px"><div class="pill">O que fazer na pessoa física</div>
 <h2 style="font-size:54px">Está perto do limite? <em>Existem saídas</em></h2>
 <div class="sol">
  <div class="s"><i></i><div><b>Acompanhe os números todo mês:</b> quantos imóveis estão alugados e quanto você recebeu.</div></div>
  <div class="s"><i></i><div><b>Concentre o patrimônio:</b> poucos imóveis de valor maior em vez de vários pequenos. Com até 3 imóveis, você fica fora da regra, qualquer que seja o valor recebido.</div></div>
  <div class="s"><i></i><div><b>Revise em nome de quem estão os imóveis:</b> regime de bens e divisão na família mudam o enquadramento.</div></div>

 </div>
