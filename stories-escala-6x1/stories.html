<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Stories Allos 6x1</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Inter",sans-serif; color:#fff; background:#070d24; }
  .st { width:1080px; height:1920px; position:relative; overflow:hidden; }
  body.single .st { display:none; } body.single .st.on { display:block; }
  .bg { position:absolute; inset:0; } .bg img { width:100%; height:100%; object-fit:cover; }
  .sh { position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,13,36,.45) 0%, rgba(7,13,36,.18) 26%, rgba(7,13,36,0) 40%, rgba(7,13,36,0) 52%, rgba(7,13,36,.3) 70%, rgba(7,13,36,.5) 100%); }
  .who { position:absolute; left:64px; top:240px; font-size:24px; font-weight:700; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .who span { display:inline-block; width:2px; height:22px; background:#fff; margin:0 9px -3px; }
  .num { position:absolute; right:64px; top:236px; font-size:26px; font-weight:800; text-shadow:0 2px 6px rgba(0,0,0,.85); }
  .head { position:absolute; left:50px; right:50px; top:290px; padding:30px 34px; border-radius:28px; background:rgba(7,13,36,.62); backdrop-filter:blur(16px); border:1.5px solid rgba(255,255,255,.16); box-shadow:0 14px 40px rgba(0,0,0,.3); }
  .pill { display:inline-block; background:#e3141e; color:#fff; font-weight:800; font-size:26px; letter-spacing:.12em; text-transform:uppercase; padding:9px 18px 8px; border-radius:10px; }
  h1 { font-family:"Inter Display","Inter",sans-serif; font-weight:900; text-transform:uppercase; font-size:62px; line-height:1.03; letter-spacing:-.045em; word-spacing:.1em; margin-top:18px; }
  h1 em { font-style:normal; color:#e3b65a; }
  .list { position:absolute; left:50px; right:50px; bottom:250px; display:flex; flex-direction:column; gap:14px; }
  .it { display:flex; gap:20px; align-items:center; padding:16px 24px; border-radius:22px; background:rgba(7,13,36,.62); border:1.5px solid rgba(255,255,255,.16); backdrop-filter:blur(16px); box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .it .ic { flex:none; font-size:42px; width:56px; text-align:center; }
  .it .tx { font-size:31px; line-height:1.25; color:rgba(255,255,255,.9); }
  .it .tx b { color:#fff; font-weight:800; } .it .tx b.g { color:#e3b65a; }
  .src { font-size:21px; color:rgba(255,255,255,.75); margin-top:2px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .next { align-self:flex-end; font-weight:900; font-size:30px; color:#070d24; background:#e3b65a; padding:14px 24px; border-radius:16px; }
  .btn { background:#e3b65a; color:#070d24; font-weight:900; font-size:36px; padding:22px 30px; border-radius:20px; text-align:center; }
  .head, .it { background:none !important; border:0 !important; backdrop-filter:none !important; box-shadow:none !important; }
  .head { padding:0 14px; }
  .it { padding:6px 14px; }
  h1, .it .tx, .src { text-shadow:0 2px 6px rgba(0,0,0,.85), 0 0 26px rgba(0,0,0,.65); }
  .it .tx { color:#fff; font-weight:600; font-size:33px; }
  .it .ic { filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .sh { background:linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.25) 24%, rgba(0,0,0,0) 38%, rgba(0,0,0,0) 50%, rgba(0,0,0,.35) 64%, rgba(0,0,0,.55) 100%) !important; }
  .cta2 { font-size:34px; line-height:1.3; font-weight:600; text-shadow:0 2px 6px rgba(0,0,0,.85), 0 0 26px rgba(0,0,0,.65); padding:0 14px; }
  .cta2 b { color:#e3b65a; font-weight:900; }
</style></head>
<body>
<script>
const W=`<div class="bg"><img src="marcus.jpg"></div><div class="sh"></div>`;
const it=(i,t)=>`<div class="it"><div class="ic">${i}</div><div class="tx">${t}</div></div>`;
const S=[
`<div class="head"><div class="pill">Você conhece?</div><h1>Quem é a Allos, <em>a gigante dos shoppings</em></h1></div>
 <div class="list">${it('🏬','A <b>maior empresa de shoppings do Brasil</b>, com cerca de <b class="g">49 shoppings</b> pelo país')}
 ${it('🤝','Nasceu da união de <b>Aliansce Sonae e brMalls</b>')}
 ${it('📈','Tem ações na bolsa: <b>ALOS3</b>')}
 ${it('👔','O CEO, <b>Rafael Sales</b>, acabou de fazer um alerta')}
 <div class="next">Veja o alerta 👉</div></div>`,
`<div class="head"><div class="pill">🚨 O alerta</div><h1>O fim da escala 6x1, segundo o CEO da Allos</h1></div>
 <div class="list">${it('👥','Lojistas poderão <b>demitir 20%</b> dos funcionários')}
 ${it('📈','<b>Mais inflação</b>, mais informalidade e <b>empregos piores</b>')}
 ${it('🛍️','Mais <b>lojas vazias</b> nos shoppings em 2027')}
 <div class="src">Fonte: NeoFeed</div></div>`,
`<div class="head"><div class="pill">🚨 E tem mais</div><h1>Quem paga a conta <em>e o freio nos investimentos</em></h1></div>
 <div class="list">${it('💰','O <b>consumidor</b> vai pagar parte dos custos extras')}
 ${it('🏗️','Dos 20 projetos de expansão da Allos, <b class="g">só 3 devem sair do papel</b>')}
 ${it('🏦','O principal motivo: <b>juros altos</b>')}
 <div class="src">Fonte: NeoFeed</div></div>`,
`<div class="head"><div class="pill">E a sua empresa?</div><h1>Como está o caixa <em>da sua empresa?</em></h1></div>
 <div class="list">${it('📊','Revise <b>custos e margens</b> antes que eles apertem')}
 ${it('💵','Tenha um <b>caixa bem investido</b> para atravessar o período')}
 ${it('🧭','Decida com <b>números</b>, não com sustos')}
 <div class="cta2">Se você quer saber <b>como investir melhor o caixa</b>, acesse o link na BIO e me chame!</div><div class="btn">👉 Link na BIO</div></div>`];
S.forEach((h,i)=>{ const s=document.createElement('section'); s.className='st'; s.innerHTML=W+`<div class="num">${i+1}/${S.length}</div>`+h; document.body.appendChild(s); });
const all=[...document.querySelectorAll('.st')];
window.show=i=>{document.body.classList.add('single');all.forEach((s,j)=>s.classList.toggle('on',j===i));};
</script>
</body></html>
