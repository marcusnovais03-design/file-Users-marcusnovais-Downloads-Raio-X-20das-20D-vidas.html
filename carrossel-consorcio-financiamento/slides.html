<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrossel consórcio x financiamento</title>
<style>
  :root { --ink:#070d24; --gold:#e3b65a; --red:#e3141e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#888; font-family:"Inter",sans-serif; color:#fff; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; margin:0 auto 40px; background:var(--ink);
    background-image:linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px); background-size:54px 54px; }
  body.single .slide { display:none; margin:0; }
  body.single .slide.on { display:block; }
  .bg { position:absolute; inset:0; } .bg img { width:100%; height:100%; object-fit:cover; display:block; }
  .shade { position:absolute; inset:0; }
  .page { position:absolute; inset:0; padding:140px 90px 160px; display:flex; flex-direction:column; justify-content:center; z-index:3; }
  .page.end { justify-content:flex-end; }
  .page.disc { padding-bottom:225px; }
  .count { position:absolute; top:60px; right:92px; font-weight:800; font-size:25px; letter-spacing:.09em; z-index:6; }
  .foot { position:absolute; left:90px; right:92px; bottom:62px; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:25px; z-index:6; }
  .foot .who span { display:inline-block; width:3px; height:26px; background:#fff; margin:0 9px -4px; }
  .foot .go { display:flex; align-items:center; gap:16px; font-weight:800; font-size:27px; }
  .aviso { position:absolute; left:90px; right:92px; bottom:118px; font-size:21px; line-height:1.3; color:rgba(255,255,255,.6); z-index:6; border-top:2px solid rgba(255,255,255,.18); padding-top:12px; }
  h1 { font-family:"Inter Display","Inter",sans-serif; font-weight:900; text-transform:uppercase; font-size:84px; line-height:1.02; letter-spacing:-.05em; word-spacing:.12em; margin-bottom:26px; }
  h2 { font-family:"Inter Display","Inter",sans-serif; font-weight:900; text-transform:uppercase; font-size:64px; line-height:1.04; letter-spacing:-.045em; word-spacing:.12em; margin-bottom:24px; }
  h1 em, h2 em { font-style:normal; color:var(--gold); }
  h1 .r, h2 .r { background:var(--red); color:#fff !important; padding:0 .14em; border-radius:10px; }
  p { font-size:36px; line-height:1.28; color:rgba(255,255,255,.88); }
  p + p { margin-top:20px; }
  b { font-weight:800; color:#fff; } b.g { color:var(--gold); }
  .pill { align-self:flex-start; color:var(--gold); font-weight:800; font-size:30px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:20px; }
  .pill.red { background:var(--red); color:#fff !important; padding:10px 22px 9px; border-radius:10px; line-height:1.3; }
  ul { list-style:none; }
  li { position:relative; padding:18px 0 18px 56px; font-size:34px; line-height:1.24; border-bottom:3px solid rgba(255,255,255,.14); color:rgba(255,255,255,.9); }
  li::before { content:""; position:absolute; left:0; top:29px; width:26px; height:26px; border-radius:50%; background:var(--gold); }
  .btn { margin-top:30px; align-self:flex-start; background:var(--gold); color:var(--ink); font-weight:900; font-size:36px; line-height:1.15; padding:22px 32px; border-radius:24px; }
  .card { border-radius:30px; overflow:hidden; box-shadow:0 24px 60px rgba(7,13,36,.35); flex:none; position:relative; margin-bottom:34px; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .cred { position:absolute; right:14px; bottom:10px; font-size:15px; font-weight:600; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.9); }
  /* claro */
  .slide.light { background-color:#f2efe8; color:#0e1f5b;
    background-image:linear-gradient(rgba(14,31,91,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(14,31,91,.05) 2px, transparent 2px); }
  .light p, .light li { color:rgba(14,31,91,.85); }
  .light b { color:#0e1f5b; } .light b.g, .light h1 em, .light h2 em { color:#a8761c; }
  .light .pill { color:#a8761c; }
  .light li { border-bottom-color:rgba(14,31,91,.15); } .light li::before { background:#a8761c; }
  .light .foot, .light .count { color:#0e1f5b; } .light .foot .who span { background:#0e1f5b; }
  .light .foot .go svg { stroke:#0e1f5b; }
  .light .aviso { color:rgba(14,31,91,.6); border-top-color:rgba(14,31,91,.18); }
  /* barras do custo */
  .bars { margin:20px 0 10px; }
  .bars .row { margin-bottom:22px; }
  .bars .lab { display:flex; justify-content:space-between; align-items:baseline; font-size:30px; font-weight:700; margin-bottom:10px; }
  .bars .lab b { font-family:"Inter Display","Inter",sans-serif; font-weight:900; font-size:50px; letter-spacing:-.03em; }
  .bars .bar { height:64px; border-radius:14px; background:rgba(14,31,91,.08); display:flex; overflow:hidden; }
  .bars .bar i { display:flex; align-items:center; justify-content:center; height:100%; font-style:normal; font-weight:800; font-size:24px; color:#fff; }
  .note { font-size:22px; line-height:1.3; color:rgba(14,31,91,.6); margin-top:4px; }
  /* troca de dívida */
  .swap { display:flex; align-items:center; gap:24px; margin-top:28px; }
  .swap > div { flex:1; border-radius:24px; padding:22px 24px; }
  .swap .k { font-size:24px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
  .swap .v { font-family:"Inter Display","Inter",sans-serif; font-weight:900; font-size:44px; line-height:1.05; margin-top:8px; letter-spacing:-.03em; }
  .swap .arr { flex:none; font-size:60px; font-weight:900; color:var(--gold); }
  /* duas parcelas */
  .parc { display:flex; gap:22px; align-items:flex-end; height:330px; margin:16px 0 30px; }
  .parc .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .parc .t { font-size:26px; font-weight:800; text-align:center; margin-bottom:12px; line-height:1.15; }
  .parc .blk { border-radius:16px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800; font-size:26px; color:#fff; line-height:1.15; padding:0 10px; }
  .parc .blk + .blk { margin-top:8px; }
  /* concorrentes */
  .dots { display:flex; gap:30px; margin:14px 0 30px; }
  .dots > div { flex:1; border-radius:24px; padding:22px 24px; border:4px solid rgba(255,255,255,.25); }
  .dots .k { font-size:26px; font-weight:800; margin-bottom:14px; }
  .dots .g { display:grid; grid-template-columns:repeat(8, 1fr); gap:8px; }
  .dots .g i { aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.28); }
  .dots .g i.y { background:var(--gold); }
  .dots .s { font-size:24px; margin-top:14px; color:rgba(255,255,255,.75); line-height:1.25; }
  .vs { display:flex; gap:22px; margin-top:26px; }
  .vs > div { flex:1; border-radius:24px; padding:22px 26px; }
  .vs .k { font-size:24px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
  .vs .v { font-family:"Inter Display","Inter",sans-serif; font-weight:900; font-size:40px; line-height:1.1; margin-top:8px; letter-spacing:-.02em; }
</style>
</head>
<body>
<script>
const HAS=new Set(window.FOTOS||['marcus']);
const CRED=window.CREDITOS||{};
const PH=(k,pos,extra)=>!HAS.has(k)?'':`<img src="img/${k}.jpg" style="object-position:${pos||'50% 50%'};${extra||''}">`;
const CARD=(k,h,pos)=>!HAS.has(k)?'':`<div class="card" style="height:${h}px">${PH(k,pos)}<span class="cred">${CRED[k]||''}</span></div>`;
const S=[];
// 1 capa (foto do Marcus, slide inteiro com transparência)
S.push({h:`<div class="bg">${PH('marcus','50% 18%')}</div>
 <div class="shade" style="background:linear-gradient(180deg, rgba(7,13,36,.28) 0%, rgba(7,13,36,.35) 35%, rgba(7,13,36,.86) 58%, rgba(7,13,36,.95) 100%)"></div>
 <div class="page end"><div class="pill red">Financiamento imobiliário</div>
 <h1 style="font-size:82px">Juros altos? Você pode estar pagando <em>dois ou três imóveis</em> para ficar com um.</h1>
 <p>Tem uma forma de trocar essa dívida cara por uma mais barata. <b class="g">👉 Arrasta</b></p></div>`});
// 2 o problema (claro, barras)
S.push({light:1, h:`<div class="page"><div class="pill">O problema</div>
 <h2>No financiamento, você paga o imóvel <em>e os juros</em></h2>
 <p>Com juros altos e prazo longo, a dívida fica cara demais. <b>O banco recebe muito mais do que emprestou.</b></p>
 <div class="bars" style="margin-top:34px">
  <div class="row"><div class="lab"><span>Valor emprestado</span><b>R$ 500 mil</b></div><div class="bar"><i style="width:36.9%; background:#0e1f5b">imóvel</i></div></div>
  <div class="row"><div class="lab"><span>Total pago ao banco</span><b style="color:var(--red)">R$ 1,36 mi</b></div><div class="bar"><i style="width:36.9%; background:#0e1f5b">imóvel</i><i style="width:63.1%; background:var(--red)">R$ 856 mil de juros</i></div></div>
 </div>
 <div class="note">Exemplo ilustrativo: R$ 500 mil em 30 anos, 12% ao ano, tabela SAC. Sem TR, seguros e taxas, que deixam a conta ainda maior.</div></div>`});
// 3 a alternativa (escuro, foto)
S.push({disc:1, h:`<div class="page disc">${CARD('casa',330,'50% 55%')}<div class="pill">A alternativa</div>
 <h2>O consórcio <em>não cobra juros</em></h2>
 <p>Só taxa de administração. Na contemplação, <b>a carta de crédito quita o seu financiamento.</b></p>
 <div class="swap"><div style="background:rgba(227,20,30,.18); border:4px solid var(--red)"><div class="k" style="color:#ff6b72">Sai</div><div class="v">Dívida cara<br><span style="font-size:28px">juros do banco</span></div></div>
  <div class="arr">→</div>
  <div style="background:rgba(227,182,90,.14); border:4px solid var(--gold)"><div class="k" style="color:var(--gold)">Entra</div><div class="v">Dívida mais barata<br><span style="font-size:28px">taxa de administração</span></div></div></div></div>`});
// 4 a fase de espera (claro, parcelas)
S.push({light:1, disc:1, h:`<div class="page disc"><div class="pill">A fase de espera</div>
 <h2>Até contemplar, você paga <em>as duas parcelas</em></h2>
 <div class="parc">
  <div class="col"><div class="t">Parcela cheia</div><div class="blk" style="height:130px; background:#0e1f5b">Financiamento</div><div class="blk" style="height:130px; background:#a8761c">Consórcio</div></div>
  <div class="col"><div class="t">Com parcela reduzida</div><div class="blk" style="height:130px; background:#0e1f5b">Financiamento</div><div class="blk" style="height:70px; background:#c8932e">Consórcio<br>até 50% menor</div></div>
 </div>
 <p>Para aliviar, muitos consórcios oferecem <b>parcela reduzida, de até 50%</b>.</p>
 <p>Ela aumenta um pouco o custo total, mas <b class="g">muitas vezes vale a pena.</b></p></div>`});
// 5 lance fidelidade (escuro, foto)
const dots=(n,y)=>Array.from({length:n},(_,i)=>`<i class="${i<y?'y':''}"></i>`).join('');
S.push({disc:1, h:`<div class="page disc">${CARD('chaves',300,'50% 50%')}<div class="pill">Lance fidelidade</div>
 <h2>Não quer usar <em>recursos próprios</em> no lance?</h2>
 <p>No lance fidelidade, <b>só concorre quem paga em dia há alguns meses.</b></p>
 <div class="dots" style="margin-top:26px"><div><div class="k">Lance livre</div><div class="g">${dots(24,1)}</div><div class="s">Todo o grupo disputa</div></div>
  <div style="border-color:var(--gold)"><div class="k" style="color:var(--gold)">Lance fidelidade</div><div class="g">${dots(8,1)}</div><div class="s">Só quem está em dia</div></div></div>
 <p style="margin-top:-6px"><b class="g">Menos concorrentes, mais chance de contemplar cedo.</b></p></div>`});
// 6 o que importa (claro)
S.push({light:1, disc:1, h:`<div class="page disc">${CARD('calculo',300,'50% 50%')}<div class="pill">O que importa</div>
 <h2>A estratégia funciona quando a contemplação <em>vem cedo</em></h2>
 <p>Por isso <b>o grupo e o lance são escolhidos antes de contratar.</b></p>
 <div class="vs"><div style="background:rgba(14,31,91,.07); border:4px solid rgba(14,31,91,.25)"><div class="k" style="color:rgba(14,31,91,.6)">Não olhe só</div><div class="v" style="color:rgba(14,31,91,.55); text-decoration:line-through">a parcela</div></div>
  <div style="background:rgba(168,118,28,.12); border:4px solid #a8761c"><div class="k" style="color:#a8761c">Olhe para</div><div class="v">o custo total</div></div></div></div>`});
// 7 CTA (foto do Marcus)
S.push({h:`<div class="bg">${PH('marcus','50% 18%')}</div>
 <div class="shade" style="background:linear-gradient(180deg, rgba(7,13,36,.28) 0%, rgba(7,13,36,.35) 35%, rgba(7,13,36,.88) 58%, rgba(7,13,36,.96) 100%)"></div>
 <div class="page end"><div class="pill red">Estudo personalizado</div>
 <h1 style="font-size:76px">Quer sair do financiamento <em>pagando menos?</em></h1>
 <p>Vamos fazer um estudo para <b>reduzir o seu custo total</b>.</p>
 <div class="btn">Acesse o link na BIO</div></div>`});

const N=S.length;
const AVISO='A contemplação ocorre por sorteio ou lance e não tem data garantida. Cada caso exige análise individual.';
S.forEach((x,i)=>{ const s=document.createElement('section'); s.className='slide'+(x.light?' light':''); if(x.video) s.dataset.video=x.video;
  s.innerHTML=x.h+(x.disc?`<div class="aviso">${AVISO}</div>`:'')+`<div class="count">${String(i+1).padStart(2,'0')}/${String(N).padStart(2,'0')}</div><div class="foot"><div class="who">Marcus Novais<span></span>Planejador Financeiro, CFP®</div>${i<N-1?'<div class="go">deslize <svg width="38" height="28" viewBox="0 0 38 28" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14h33M23 3l12 11-12 11"/></svg></div>':''}</div>`;
  document.body.appendChild(s); });
const all=[...document.querySelectorAll('.slide')];
window.setT=()=>{};
window.show=i=>{document.body.classList.add('single');all.forEach((s,j)=>s.classList.toggle('on',j===i));};
</script>
</body>
</html>
