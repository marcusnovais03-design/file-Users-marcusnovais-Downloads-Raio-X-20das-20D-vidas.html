<!doctype html>
<html><head><meta charset="utf-8"><title>Lances no consórcio</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Animação "As 4 pistas do consórcio". a timeline (timeline.json) é passada pelo render.js em window.setup();
   window.renderAt(t) desenha o quadro do instante t (segundos). */
const W = 1080, H = 1920, cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = "'Inter Display','Inter',sans-serif";
const CREAM = '#F4EFE6', GOLD = '#F5C542', INK = '#0B0F1A';
const LANES = [
  { k: 'sorteio', tab: 'SORTEIO', name: 'SORTEIO', c: '#2EC4B6' },
  { k: 'livre', tab: 'LIVRE', name: 'LANCE LIVRE', c: '#FF6B5B' },
  { k: 'fixo', tab: 'FIXO', name: 'LANCE FIXO', c: '#6C9BFF' },
  { k: 'fidelidade', tab: 'FIDELIDADE', name: 'LANCE FIDELIDADE', c: '#F5C542' }];
const SHIRTS = ['#2EC4B6', '#FF6B5B', '#6C9BFF', '#F5C542', '#B388FF', '#FF9F43', '#5ED67A', '#FF7EB6', '#EDEDED'];
const SKINS = ['#F2C9A5', '#D9A37C', '#B97E57', '#8A5A3C', '#6B4329', '#E8B48E'];
const HAIRS = ['#1C1410', '#3A2618', '#0E0E12', '#5B3A1E', '#2A2A30'];

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = u => 1 - Math.pow(1 - clamp(u), 3);
const ei = u => Math.pow(clamp(u), 2.4);
const eio = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const back = u => { u = clamp(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 16807 + 12345) % 2147483647; return (s & 0xffffff) / 0x1000000; }; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
  return `rgb(${Math.round(r * f)},${Math.round(gg * f)},${Math.round(b * f)})`;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(wt, px) { g.font = `${wt} ${px}px ${FONT}`; }
function text(s, x, y, wt, px, col, align = 'center', ls = 0) {
  font(wt, px); g.letterSpacing = ls + 'px'; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = '0px';
}
function tw(s, wt, px, ls = 0) { font(wt, px); g.letterSpacing = ls + 'px'; const w = g.measureText(s).width; g.letterSpacing = '0px'; return w; }

function limb(ax, ay, bx, by, cx, cy, w, col) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.stroke();
}
function hex2(c) { if (c.startsWith('rgb')) return c.match(/\d+/g).map(Number); const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixCol(a, b, u) { const A = hex2(a), B = hex2(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], u))).join(',')})`; }
function shade2(c, f) { const A = hex2(c); return `rgb(${A.map(v => Math.round(v * f)).join(',')})`; }

function tag(p, label, pop, col = CREAM, tcol = INK, star = false, lift = 0) {
  if (pop <= 0) return;
  const k = back(pop), w = tw(label, 800, 34) + 40 + (star ? 40 : 0), h = 58, x = p.x + 8, y = p.y - 296 * p.s - lift;
  g.save(); g.translate(x, y); g.scale(k, k); g.globalAlpha *= clamp(pop * 3);
  g.fillStyle = 'rgba(0,0,0,0.35)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, 16); g.fill();
  g.fillStyle = col; rr(-w / 2, -h / 2, w, h, 16); g.fill();
  g.beginPath(); g.moveTo(-12, h / 2 - 1); g.lineTo(12, h / 2 - 1); g.lineTo(0, h / 2 + 15); g.fill();
  if (star) drawStar(-w / 2 + 34, 0, 15, tcol);
  text(label, star ? 20 : 0, 2, 800, 34, tcol);
  g.restore();
}
function drawStar(x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(x + q * Math.cos(a), y + q * Math.sin(a)); }
  g.fill();
}

// ---------- globo do sorteio ----------
function drum(x, y, pop, t, c) {
  if (pop <= 0) return;
  g.save(); g.translate(x, y); g.scale(back(pop), back(pop));
  g.fillStyle = '#0A0E1C'; g.beginPath(); g.moveTo(-58, 132); g.lineTo(58, 132); g.lineTo(26, 84); g.lineTo(-26, 84); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.beginPath(); g.arc(0, 0, 96, 0, 7); g.fill();
  const r = rnd(5);
  for (let i = 0; i < 14; i++) {
    const a0 = r() * 6.28, rad = 22 + r() * 56, sp = (1.8 + r() * 2.4) * (i % 2 ? 1 : -1), a = a0 + t * sp;
    const bx = Math.cos(a) * rad, by = Math.sin(a * 1.3 + i) * rad * 0.9;
    g.fillStyle = i % 3 ? '#F4EFE6' : c; g.beginPath(); g.arc(bx, by, 15, 0, 7); g.fill();
  }
  g.strokeStyle = GOLD; g.lineWidth = 8; g.beginPath(); g.arc(0, 0, 96, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, 78, 3.5, 4.5); g.stroke();
  g.restore();
}
function ball(x0, y0, p, u, label) {   // voa do globo até acima do corredor p
  if (u <= 0) return;
  const k = eo(u), x1 = p.x + 8, y1 = p.y - 300 * p.s, x = mix(x0, x1, k), y = mix(y0, y1, k) - 170 * Math.sin(Math.PI * k), r = mix(16, 44, k);
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.arc(x + 3, y + 5, r, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = GOLD; g.lineWidth = 6; g.stroke();
  if (k > 0.5) text(label, x, y + 2, 800, 36, INK);
}

// ---------- confete e cartão ----------
function confetti(x, y, t0, t) {
  const u = t - t0; if (u < 0 || u > 2.2) return;
  const r = rnd(31);
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2.6, v = 500 + r() * 900, cx = x + Math.cos(a) * v * u * 0.75, cy = y + Math.sin(a) * v * u + 900 * u * u, rot = r() * 6 + u * (4 + r() * 8);
    g.save(); g.translate(cx, cy); g.rotate(rot); g.globalAlpha = clamp(2.2 - u) * 0.95;
    g.fillStyle = [GOLD, '#fff', '#2EC4B6', '#FF6B5B', '#6C9BFF'][i % 5]; g.fillRect(-9, -5, 18, 10 * Math.cos(rot * 1.7)); g.restore();
  }
}
function winCard(t0, t, c) {
  const u = t - t0; if (u < 0) return;
  const k = back(u / 0.45), w = 700, h = 170;
  g.save(); g.translate(540, 372); g.scale(k, k); g.globalAlpha *= clamp(u * 6);
  g.fillStyle = 'rgba(0,0,0,0.4)'; rr(-w / 2 + 6, -h / 2 + 10, w, h, 30); g.fill();
  g.fillStyle = CREAM; rr(-w / 2, -h / 2, w, h, 30); g.fill();
  g.fillStyle = c; rr(-w / 2, -h / 2, 22, h, [30, 0, 0, 30]); g.fill();
  g.fillStyle = '#17A673'; g.beginPath(); g.arc(-w / 2 + 104, 0, 46, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
  const ck = clamp((u - 0.2) / 0.3);
  g.beginPath(); g.moveTo(-w / 2 + 84, 2); g.lineTo(-w / 2 + 84 + 14 * Math.min(1, ck * 2), 2 + 16 * Math.min(1, ck * 2));
  if (ck > 0.5) g.lineTo(-w / 2 + 98 + 28 * (ck - 0.5) * 2, 18 - 34 * (ck - 0.5) * 2); g.stroke();
  text('CONTEMPLADO!', -w / 2 + 176, -24, 900, 58, INK, 'left', 0.5);
  text('Carta de crédito na mão', -w / 2 + 178, 36, 600, 32, '#4A4F5E', 'left');
  g.restore();
}

// ---------- interface ----------
function fitText(s, x, y, wt, px, col, maxW, ls = 0) { const w = tw(s, wt, px, ls); if (w > maxW) px = px * maxW / w; text(s, x, y, wt, px, col, 'center', ls); }
function captions(t) {
  for (const id in TL.seg) {
    const sgm = TL.seg[id]; if (t < sgm.s - 0.05 || t > sgm.e + 0.18) continue;
    const words = sgm.cap.split(' '), chunks = []; let cur = '';
    for (const w of words) { if (cur && (cur + ' ' + w).length > 25) { chunks.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }
    chunks.push(cur);
    const tot = chunks.reduce((n, c) => n + c.length + 2, 0); let acc = sgm.s;
    for (let i = 0; i < chunks.length; i++) {
      const d = (sgm.e - sgm.s) * (chunks[i].length + 2) / tot, end = i === chunks.length - 1 ? sgm.e + 0.18 : acc + d;
      if (t >= acc - 0.05 && t < end) {
        const k = eo(seg(t, acc - 0.05, acc + 0.12)), w = tw(chunks[i], 800, 52) + 64;
        g.save(); g.translate(540, 1462 + 14 * (1 - k)); g.globalAlpha = k;
        g.fillStyle = 'rgba(5,8,16,0.72)'; rr(-w / 2, -48, w, 96, 22); g.fill();
        text(chunks[i], 0, 3, 800, 52, CREAM); g.restore(); return;
      }
      acc += d;
    }
  }
}

// ---------- elenco ----------
// ================= VISTA DE TRÁS: 4 pórticos de chegada =================
const GY = 820, FAR = 440;                       // base dos pórticos / profundidade do campo
const U = [-375, -125, 125, 375];                // centro de cada pista (no plano do pórtico)
const COUNT = [14, 9, 5, 3];                     // gente na disputa em cada pista (ilustrativo)
const kx = y => 1 + 0.08 * (y - GY) / FAR;
const sc_ = y => 0.42 + 0.43 * (y - GY) / FAR;
const wxOf = (lane, u, y) => 540 + (U[lane] + u) * kx(y);
let TL, CAM = { z: 1, cx: 540 };
function cameraAt(t) {
  const s = TL.scenes, Z = 1.4, keys = [[s.sorteio.s, 0], [s.livre.s, 1], [s.fixo.s, 2], [s.fidelidade.s, 3]];
  let z = 1, cx = 540;
  for (const [t0, i] of keys) { const u = eio(seg(t, t0 - 0.15, t0 + 0.75)); z = mix(z, Z, u); cx = mix(cx, 540 + U[i] * 1.04, u); }
  const o = eio(seg(t, s.recap.s - 0.1, s.recap.s + 0.8)); return { z: mix(z, 1, o), cx: mix(cx, 540, o) };
}
const scr = (wx, wy) => ({ x: (wx - CAM.cx) * CAM.z + 540, y: (wy - GY) * CAM.z + GY });
function camOn() { g.setTransform(CAM.z, 0, 0, CAM.z, 540 - CAM.cx * CAM.z, GY - GY * CAM.z); }
function camOff() { g.setTransform(1, 0, 0, 1, 0, 0); }

function background(t) {
  camOff();
  let gr = g.createLinearGradient(0, 0, 0, 900);
  gr.addColorStop(0, '#070B18'); gr.addColorStop(0.6, '#141C3C'); gr.addColorStop(1, '#2A2C5A');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const r = rnd(7);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = r() * 640, a = 0.25 + 0.5 * r(), tws = 0.6 + 0.4 * Math.sin(t * (1 + r() * 2) + r() * 6);
    g.fillStyle = `rgba(255,255,255,${a * tws})`; g.fillRect(x, y, 3, 3);
  }
  camOn();
  for (const x of [-120, 290, 790, 1200]) {      // clarão dos refletores
    gr = g.createRadialGradient(x, GY - 150, 0, x, GY - 150, 330);
    gr.addColorStop(0, 'rgba(255,236,190,0.26)'); gr.addColorStop(1, 'rgba(255,236,190,0)');
    g.fillStyle = gr; g.fillRect(x - 330, GY - 480, 660, 660);
  }
  g.fillStyle = '#0C1124'; g.fillRect(-600, GY - 118, 2300, 120);                 // arquibancada
  const r2 = rnd(11);
  for (let row = 0; row < 5; row++) for (let i = 0; i < 90; i++) {
    g.globalAlpha = 0.3 + 0.25 * r2(); g.fillStyle = SHIRTS[Math.floor(r2() * SHIRTS.length)];
    g.beginPath(); g.arc(-560 + i * 25 + row * 9, GY - 104 + row * 17 + 2 * Math.sin(t * 5 + i), 4.5, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#1B2550'; g.fillRect(-600, GY - 26, 2300, 26);
  // gramado + pista
  g.fillStyle = '#0E2A22'; g.fillRect(-900, GY, 2900, 1400);
  gr = g.createLinearGradient(0, GY, 0, GY + 620); gr.addColorStop(0, '#9A3F30'); gr.addColorStop(1, '#C65A41');
  g.fillStyle = gr; g.beginPath(); g.moveTo(540 - 500, GY); g.lineTo(540 + 500, GY); g.lineTo(540 + 500 * kx(2200), 2200); g.lineTo(540 - 500 * kx(2200), 2200); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 3;
  for (let y = GY + 60; y < 2000; y += 96) { g.beginPath(); g.moveTo(540 - 500 * kx(y), y); g.lineTo(540 + 500 * kx(y), y); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 5;
  for (let i = 0; i <= 4; i++) { const u = -500 + i * 250; g.beginPath(); g.moveTo(540 + u, GY); g.lineTo(540 + u * kx(2200), 2200); g.stroke(); }
}

// pórtico de chegada com a placa da modalidade
function gate(i, lit, flash, t) {
  const L = LANES[i], x = 540 + U[i], hw = 116, top = GY - 204, bh = 84;
  for (let c = 0; c < 10; c++) for (let rw = 0; rw < 2; rw++) {       // faixa quadriculada
    g.fillStyle = (c + rw) % 2 ? '#111' : '#fff'; g.fillRect(x - 125 + c * 25, GY + rw * 9, 25, 9);
  }
  g.fillStyle = '#E9E3D6'; g.fillRect(x - hw, top + 10, 11, GY - top - 10); g.fillRect(x + hw - 11, top + 10, 11, GY - top - 10);
  if (lit > 0.02) {
    const gr = g.createRadialGradient(x, top + bh / 2, 10, x, top + bh / 2, 190);
    gr.addColorStop(0, `rgba(255,255,255,${0.22 * lit})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, top + bh / 2, 190, 0, 7); g.fill();
  }
  const fill = mixCol(mixCol('#0B0F1A', L.c, lit), '#FFFFFF', flash * 0.7), tc = mixCol('#F4EFE6', '#0B0F1A', lit);
  g.fillStyle = fill; rr(x - hw - 6, top, 2 * hw + 12, bh, 12); g.fill();
  g.strokeStyle = L.c; g.lineWidth = 4; rr(x - hw - 6, top, 2 * hw + 12, bh, 12); g.stroke();
  const parts = L.name.split(' ');
  if (parts.length === 1) fitText(parts[0], x, top + bh / 2 + 2, 900, 42, tc, 206, 1);
  else { text(parts[0], x, top + 22, 800, 20, tc, 'center', 5); fitText(parts[1], x, top + 55, 900, 40, tc, 206, 1); }
  // quantos disputam
  g.globalAlpha = 0.9; text(String(COUNT[i]), x, GY - 93, 900, 40, L.c); text('na disputa', x, GY - 63, 700, 17, 'rgba(244,239,230,0.8)', 'center', 1); g.globalAlpha = 1;
}

// corredor visto de costas
function runnerBack(wx, wy, s, ph, amp, o) {
  const a = o.alpha ?? 1; if (a <= 0.01) return;
  const gray = o.gray || 0, tone = c => gray ? mixCol(c, '#565B6B', gray) : c;
  const shirt = tone(o.shirt), skin = tone(o.skin), hair = tone(o.hair), shorts = tone('#141A30'), cheer = o.cheer || 0;
  g.save(); g.globalAlpha *= a; g.translate(wx, wy); g.scale(s, s);
  if (o.glow) {
    const gr = g.createRadialGradient(0, -130, 10, 0, -130, 240);
    gr.addColorStop(0, `rgba(255,214,102,${0.6 * o.glow})`); gr.addColorStop(1, 'rgba(255,214,102,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, -130, 240, 0, 7); g.fill();
    g.strokeStyle = `rgba(245,197,66,${o.glow})`; g.lineWidth = 7; g.beginPath(); g.ellipse(0, 4, 70, 20, 0, 0, 7); g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,0.30)'; g.beginPath(); g.ellipse(0, 4, 50, 13, 0, 0, 7); g.fill();
  const sn = Math.sin(ph), bob = -Math.abs(sn) * 10 * amp;
  g.translate(sn * 3 * amp, bob);
  for (const sg of [-1, 1]) {                                   // pernas
    const lift = Math.max(0, sg * sn) * amp, fy = -bob - lift * 46, kxp = sg * 16, kyp = -58 - lift * 14;
    limb(sg * 14, -110, kxp, kyp, sg * 15, fy - 6, 22, lift > 0.05 ? shade2(skin, 0.85) : skin);
    limb(sg * 14, -110, sg * 15, -84 - lift * 6, sg * 15, -84 - lift * 6, 29, shorts);
    if (lift > 0.25) { g.fillStyle = tone('#D8D2C6'); g.beginPath(); g.ellipse(sg * 15, fy - 6, 12, 15, 0, 0, 7); g.fill(); }
    else { g.fillStyle = tone('#F4EFE6'); rr(sg * 15 - 12, fy - 12, 24, 14, 6); g.fill(); }
  }
  g.fillStyle = shirt; g.strokeStyle = shirt; g.lineWidth = 14; g.lineJoin = 'round';     // tronco
  g.beginPath(); g.moveTo(-31, -196); g.lineTo(31, -196); g.lineTo(24, -112); g.lineTo(-24, -112); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = gray ? '#B5B7C0' : '#fff'; rr(-21, -182, 42, 32, 5); g.fill();
  text(o.bib, 0, -165, 800, 21, '#141A30');
  for (const sg of [-1, 1]) {                                   // braços
    const sw = -sg * sn * amp;
    const ex = mix(sg * 47, sg * 58, cheer), ey = mix(-148 - sw * 8, -236, cheer), hx = mix(sg * 36, sg * 52, cheer), hy = mix(-130 - sw * 30, -288 + 5 * Math.sin((o.cheerT || 0) * 12), cheer);
    limb(sg * 38, -192, ex, ey, hx, hy, 15, skin);
    limb(sg * 38, -192, mix(sg * 38, ex, 0.45), mix(-192, ey, 0.45), mix(sg * 38, ex, 0.45), mix(-192, ey, 0.45), 19, shirt);
  }
  limb(0, -200, 0, -214, 0, -214, 17, skin);                     // pescoço e cabeça
  g.fillStyle = skin; g.beginPath(); g.arc(0, -233, 23, 0, 7); g.fill();
  g.beginPath(); g.arc(-23, -234, 5, 0, 7); g.arc(23, -234, 5, 0, 7); g.fill();
  g.fillStyle = hair; g.beginPath(); g.arc(0, -239, 23, 0, 7); g.fill();
  g.restore();
}

// ---------- elenco ----------
function slots(rows, y0, dy, spread = 78) {
  const out = []; rows.forEach((m, r) => { for (let c = 0; c < m; c++) out.push({ u: (c - (m - 1) / 2) * spread, y: y0 + r * dy }); }); return out;
}
const SLOTS = [slots([3, 3, 3, 3, 2], 905, 72), slots([3, 3, 3], 930, 100), slots([2, 3], 960, 120), [{ u: 0, y: 950 }, { u: -80, y: 1065 }, { u: 80, y: 1065 }]];
function look(seed, n) {
  const r = rnd(seed), out = [];
  for (let i = 0; i < n; i++) out.push({ ph: r() * 6.28, cad: 0.92 + r() * 0.16, ju: (r() - 0.5) * 16, jy: (r() - 0.5) * 14,
    shirt: SHIRTS[(i * 2 + seed + Math.floor(r() * 3)) % SHIRTS.length], skin: SKINS[Math.floor(r() * SKINS.length)], hair: HAIRS[Math.floor(r() * HAIRS.length)], bib: String(10 + Math.floor(r() * 89)) });
  return out;
}
const PACK = SLOTS.map((sl, i) => look(21 + i * 7, sl.length).map((r, j) => ({ ...r, lane: i, u: sl[j].u + r.ju, y: sl[j].y + r.jy })));
const SW = 7;  PACK[0][SW].bib = '27';                         // sorteado
const BIDS = [18, 31, 12, 45, 24, 52, 38, 27, 41], LW = 5;     // lance livre: quem dá 52% leva
const RANKSLOT = [1, 0, 2, 4, 3, 5, 7, 6, 8];                  // maior lance fica mais perto da chegada
const FW = 2, VW = 0;
const BLOCKED = look(77, 4).map((r, j) => ({ ...r, lane: 3, u: [-96, -34, 30, 94][j], y: 1285 + (j % 2) * 26 }));
const CROSS = look(55, 40);                                    // gente cruzando a linha na abertura e no final
let CROSSERS = [];
function fade(t, sc) { return eio(seg(t, sc.s, sc.s + 0.35)) * (1 - eio(seg(t, sc.e - 0.3, sc.e))); }

function goWin(st, r, t, tGo, win, u0 = r.u, y0 = r.y) {        // dispara e atravessa o pórtico

  return document.fonts.ready.then(() => true);
};
