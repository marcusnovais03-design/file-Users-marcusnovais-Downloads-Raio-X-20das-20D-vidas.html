<!doctype html>
<html><head><meta charset="utf-8"><title>Lances no consórcio</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Animação "As 4 pistas do consórcio". window.TL (timeline.json) é injetada pelo render.js;
   window.renderAt(t) desenha o quadro do instante t (segundos). */
const W = 1080, H = 1920, cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = "'Inter Display','Inter',sans-serif";
const CREAM = '#F4EFE6', GOLD = '#F5C542', INK = '#0B0F1A';
const LANES = [
  { k: 'sorteio', tab: 'SORTEIO', name: 'SORTEIO', c: '#2EC4B6' },
  { k: 'livre', tab: 'LIVRE', name: 'LANCE LIVRE', c: '#FF6B5B' },
  { k: 'fixo', tab: 'FIXO', name: 'LANCE FIXO', c: '#6C9BFF' },
  { k: 'fidelidade', tab: 'FIDELIDADE', name: 'LANCE FIDELIDADE', c: '#F5C542' }];
const SHIRTS = ['#2EC4B6', '#FF6B5B', '#6C9BFF', '#F5C542', '#B388FF', '#FF9F43', '#5ED67A', '#FF7EB6', '#EDEDED'];
const SKINS = ['#F2C9A5', '#D9A37C', '#B97E57', '#8A5A3C', '#6B4329', '#E8B48E'];
const HAIRS = ['#1C1410', '#3A2618', '#0E0E12', '#5B3A1E', '#2A2A30'];

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = u => 1 - Math.pow(1 - clamp(u), 3);
const ei = u => Math.pow(clamp(u), 2.4);
const eio = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const back = u => { u = clamp(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 16807 + 12345) % 2147483647; return (s & 0xffffff) / 0x1000000; }; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
  return `rgb(${Math.round(r * f)},${Math.round(gg * f)},${Math.round(b * f)})`;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(wt, px) { g.font = `${wt} ${px}px ${FONT}`; }
function text(s, x, y, wt, px, col, align = 'center', ls = 0) {
  font(wt, px); g.letterSpacing = ls + 'px'; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = '0px';
}
function tw(s, wt, px, ls = 0) { font(wt, px); g.letterSpacing = ls + 'px'; const w = g.measureText(s).width; g.letterSpacing = '0px'; return w; }

// ---------- pista / projeção oblíqua ----------
const Y_FRONT = 1200, Y_BACK = 1035, SLANT = 120, V = 540, XL = 760;
const proj = (wx, d) => ({ x: wx + d * SLANT, y: Y_FRONT - d * (Y_FRONT - Y_BACK), s: (1 - 0.13 * d) * 1.3 });

let TL, S = [], RUNT = [], DT = 1 / 120;
function speedAt(t) {
  for (const L of LANES) {
    const sc = TL.scenes[L.k];
    if (t > sc.win - 0.5 && t < sc.e + 0.45) {
      if (t < sc.win + 0.4) return V * (1 - seg(t, sc.win - 0.5, sc.win + 0.4));
      if (t < sc.e) return 0;
      return V * eio(seg(t, sc.e, sc.e + 0.45));
    }
  }
  return V;
}
function init(tl) {
  TL = tl; S = [0];
  for (let i = 1; i <= Math.ceil((TL.total + 1) / DT); i++) S.push(S[i - 1] + speedAt(i * DT) * DT);
  for (const L of LANES) { const sc = TL.scenes[L.k]; sc.lineW = scroll(sc.win + 0.4) + XL; }
  TL.scenes.intro.lineW = scroll(TL.seg.i1.s + 3.3) + 560;
}
function scroll(t) { const f = clamp(t, 0, TL.total + 0.9) / DT, i = Math.floor(f); return mix(S[i], S[Math.min(i + 1, S.length - 1)], f - i); }

// ---------- cenário ----------
function background(t) {
  const sc = scroll(t);
  let gr = g.createLinearGradient(0, 0, 0, 1040);
  gr.addColorStop(0, '#070B18'); gr.addColorStop(0.55, '#141C3C'); gr.addColorStop(1, '#2A2C5A');
  g.fillStyle = gr; g.fillRect(0, 0, W, 1040);
  const r = rnd(7);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = r() * 720, a = 0.25 + 0.5 * r(), tws = 0.6 + 0.4 * Math.sin(t * (1 + r() * 2) + r() * 6);
    g.fillStyle = `rgba(255,255,255,${a * tws})`; g.fillRect(x, y, 3, 3);
  }
  // torres de luz (paralaxe lenta)
  for (let i = -1; i < 4; i++) {
    const x = ((i * 620 - sc * 0.12) % 1860 + 1860) % 1860 - 300;
    gr = g.createRadialGradient(x, 790, 0, x, 790, 300);
    gr.addColorStop(0, 'rgba(255,236,190,0.30)'); gr.addColorStop(1, 'rgba(255,236,190,0)');
    g.fillStyle = gr; g.fillRect(x - 300, 490, 600, 600);
    g.fillStyle = '#0A0E1C'; g.fillRect(x - 5, 800, 10, 180);
    rr(x - 46, 772, 92, 34, 6); g.fill();
    g.fillStyle = '#FFF1C9';
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(x - 30 + k * 20, 789, 6, 0, 7); g.fill(); }
  }
  // arquibancada
  const off = (sc * 0.3) % 240;
  g.fillStyle = '#0C1124';
  g.beginPath(); g.moveTo(0, 905);
  for (let x = -off - 240; x < W + 240; x += 240) { g.lineTo(x, 905); g.lineTo(x + 30, 880); g.lineTo(x + 210, 880); g.lineTo(x + 240, 905); }
  g.lineTo(W, 1000); g.lineTo(0, 1000); g.fill();
  const r2 = rnd(11);
  for (let row = 0; row < 4; row++) for (let i = 0; i < 60; i++) {
    const x = ((i * 31 + row * 13 - sc * 0.3) % 1860 + 1860) % 1860 - 300, cc = SHIRTS[Math.floor(r2() * SHIRTS.length)];
    g.globalAlpha = 0.33 + 0.2 * r2(); g.fillStyle = cc; g.beginPath(); g.arc(x, 916 + row * 19 + 2 * Math.sin(t * 5 + i), 5, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  // placas na beira da pista
  const o2 = sc % 360, cols = ['#1B2550', '#232F66'];
  for (let x = -o2 - 360, i = Math.floor(sc / 360); x < W + 360; x += 360, i++) {
    g.fillStyle = cols[((i % 2) + 2) % 2]; g.fillRect(x + SLANT, 992, 360, 44);
    g.fillStyle = 'rgba(245,197,66,0.55)'; g.fillRect(x + SLANT + 40, 1010, 90, 8);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x + SLANT + 150, 1010, 170, 8);
  }
  // pista
  gr = g.createLinearGradient(0, Y_BACK, 0, 1240);
  gr.addColorStop(0, '#9A3F30'); gr.addColorStop(1, '#C65A41');
  g.fillStyle = gr; g.fillRect(0, Y_BACK, W, 1240 - Y_BACK);
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 4;
  for (let i = 0; i <= 4; i++) { const y = Y_BACK + 4 + i * ((1232 - Y_BACK) / 4); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // marcas inclinadas que passam (sensação de movimento)
  const o3 = sc % 270;
  g.strokeStyle = 'rgba(255,255,255,0.20)'; g.lineWidth = 6;
  for (let x = -o3 - 270; x < W + 270; x += 270) { g.beginPath(); g.moveTo(x + SLANT + 16, Y_BACK + 4); g.lineTo(x - 22, 1232); g.stroke(); }
  // guia (zebra)
  const o4 = sc % 120;
  for (let x = -o4 - 120, i = Math.floor(sc / 120); x < W + 120; x += 120, i++) {
    g.fillStyle = ((i % 2) + 2) % 2 ? '#EDE7DB' : '#C7402F'; g.fillRect(x, 1236, 120, 16);
  }
  // gramado
  gr = g.createLinearGradient(0, 1252, 0, H);
  gr.addColorStop(0, '#0E2A22'); gr.addColorStop(0.25, '#0A1719'); gr.addColorStop(1, '#070B14');
  g.fillStyle = gr; g.fillRect(0, 1252, W, H - 1252);
}

function finishLine(lineW, t, a = 1) {
  const x = lineW - scroll(t);
  if (x < -400 || x > W + 200) return;
  g.save(); g.globalAlpha = a;
  const n = 8, wBand = 44;
  for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
    const d0 = 1 - i / n, d1 = 1 - (i + 1) / n, p0 = proj(x + j * wBand / 2, d0), p1 = proj(x + j * wBand / 2, d1);
    g.fillStyle = (i + j) % 2 ? '#111' : '#fff';
    g.beginPath(); g.moveTo(p0.x, p0.y + 4); g.lineTo(p0.x + wBand / 2, p0.y + 4); g.lineTo(p1.x + wBand / 2, p1.y + 34 * (i === n - 1)); g.lineTo(p1.x, p1.y + 34 * (i === n - 1)); g.fill();
  }
  // pórtico
  const pb = proj(x + wBand / 2, 1), pf = proj(x + wBand / 2, 0);
  g.strokeStyle = '#E9E3D6'; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(pb.x, pb.y); g.lineTo(pb.x, pb.y - 262); g.stroke();
  g.fillStyle = INK; rr(pb.x - 150, pb.y - 336, 300, 78, 12); g.fill();
  g.strokeStyle = GOLD; g.lineWidth = 4; rr(pb.x - 150, pb.y - 336, 300, 78, 12); g.stroke();
  text('CONTEMPLAÇÃO', pb.x, pb.y - 296, 800, 30, GOLD, 'center', 2);
  g.restore();
}
function finishPostFront(lineW, t, a = 1) {
  const x = lineW - scroll(t); if (x < -400 || x > W + 200) return;
  const pf = proj(x + 22, 0);
  g.save(); g.globalAlpha = a; g.strokeStyle = '#E9E3D6'; g.lineWidth = 14; g.lineCap = 'round';
  g.beginPath(); g.moveTo(pf.x, pf.y + 34); g.lineTo(pf.x, pf.y - 150); g.stroke();
  g.fillStyle = GOLD; g.beginPath(); g.arc(pf.x, pf.y - 158, 13, 0, 7); g.fill(); g.restore();
}

// ---------- corredor ----------
function limb(ax, ay, bx, by, cx, cy, w, col) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.stroke();
}
function runner(wx, d, ph, amp, o) {
  const p = proj(wx, d), s = p.s * 1.0, a = o.alpha ?? 1;
  if (a <= 0.01 || p.x < -150 || p.x > W + 150) return p;
  const gray = o.gray || 0;
  const tone = c => gray ? mixCol(c, '#565B6B', gray) : c;
  const shirt = tone(o.shirt), skin = tone(o.skin), hair = tone(o.hair), shorts = tone('#141A30');
  const L1 = 58, L2 = 60, hipY0 = -114;
  const legPts = phs => {
    const an = 0.85 * amp * Math.sin(phs), bend = amp * (0.25 + 1.15 * Math.max(0, Math.cos(phs)));
    const kx = L1 * Math.sin(an), ky = L1 * Math.cos(an), fx = kx + L2 * Math.sin(an - bend), fy = ky + L2 * Math.cos(an - bend);
    return { kx, ky, fx, fy, toe: an - bend };
  };
  const A = legPts(ph), B = legPts(ph + Math.PI);
  const lift = -(Math.max(A.fy, B.fy) + hipY0);       // pé mais baixo encosta no chão
  const lean = 0.16 * amp + 0.02;
  g.save(); g.globalAlpha = a; g.translate(p.x, p.y); g.scale(s, s);
  if (o.glow) {
    const gr = g.createRadialGradient(0, -120, 10, 0, -120, 230);
    gr.addColorStop(0, `rgba(255,214,102,${0.55 * o.glow})`); gr.addColorStop(1, 'rgba(255,214,102,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, -120, 228, 0, 7); g.fill();
    g.strokeStyle = `rgba(245,197,66,${o.glow})`; g.lineWidth = 6; g.beginPath(); g.ellipse(0, 6, 78, 20, 0, 0, 7); g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,0.30)'; g.beginPath(); g.ellipse(4, 8, 58, 13, 0, 0, 7); g.fill();
  g.translate(0, lift);
  const hx = 0, hy = hipY0, sx = hx + 86 * Math.sin(lean), sy = hy - 86 * Math.cos(lean);
  const arm = (phs, col, wdt) => {
    let ua = -0.95 * amp * Math.sin(phs) + 0.1, fa = ua + 0.35 + 1.25 * amp;
    if (o.cheer) { const sgn = phs === ph ? 1 : -1; ua = mix(ua, Math.PI - 0.45 * sgn + 0.15 * Math.sin(o.cheerT * 11), o.cheer); fa = mix(fa, Math.PI - 0.15 * sgn, o.cheer); }
    const ex = sx + 46 * Math.sin(ua), ey = sy + 8 + 46 * Math.cos(ua);
    limb(sx, sy + 8, ex, ey, ex + 42 * Math.sin(fa), ey + 42 * Math.cos(fa), wdt, col);
  };
  const leg = (P, col, shoe) => {
    limb(hx, hy, hx + P.kx, hy + P.ky, hx + P.fx, hy + P.fy, 21, col);
    limb(hx, hy, hx + P.kx * 0.55, hy + P.ky * 0.55, hx + P.kx * 0.55, hy + P.ky * 0.55, 27, shorts);
    const tx = hx + P.fx, ty = hy + P.fy;
    limb(tx - 4, ty, tx + 20 * Math.cos(P.toe * 0.6), ty - 20 * Math.sin(P.toe * 0.6) * 0.6, tx + 20 * Math.cos(P.toe * 0.6), ty - 12 * Math.sin(P.toe * 0.6), 15, shoe);
  };
  arm(ph + Math.PI, shade2(skin, 0.72), 15);
  leg(B, shade2(skin, 0.72), tone('#B9B4AA'));
  limb(hx, hy - 6, sx, sy + 14, sx, sy + 14, 50, shirt);          // tronco
  leg(A, skin, tone('#F4EFE6'));
  // número de peito
  const mx = (hx + sx) / 2 + 3, my = (hy + sy) / 2 + 4;
  g.fillStyle = gray ? '#B5B7C0' : '#fff'; rr(mx - 19, my - 14, 38, 28, 5); g.fill();
  text(o.bib, mx, my + 1, 800, 18, '#141A30');
  // cabeça
  const cx = sx + 9, cy = sy - 34;
  limb(sx + 2, sy + 2, cx - 2, cy + 14, cx - 2, cy + 14, 17, skin);
  g.fillStyle = hair; g.beginPath(); g.arc(cx - 4, cy - 5, 25, 0, 7); g.fill();
  g.fillStyle = skin; g.beginPath(); g.arc(cx + 2, cy + 1, 23, 0, 7); g.fill();
  arm(ph, skin, 16);
  g.restore();
  return p;
}
function hex2(c) { if (c.startsWith('rgb')) return c.match(/\d+/g).map(Number); const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixCol(a, b, u) { const A = hex2(a), B = hex2(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], u))).join(',')})`; }
function shade2(c, f) { const A = hex2(c); return `rgb(${A.map(v => Math.round(v * f)).join(',')})`; }

function tag(p, label, pop, col = CREAM, tcol = INK, star = false, lift = 0) {
  if (pop <= 0) return;
  const k = back(pop), w = tw(label, 800, 34) + 40 + (star ? 40 : 0), h = 58, x = p.x + 8, y = p.y - 296 * p.s - lift;
  g.save(); g.translate(x, y); g.scale(k, k); g.globalAlpha *= clamp(pop * 3);
  g.fillStyle = 'rgba(0,0,0,0.35)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, 16); g.fill();
  g.fillStyle = col; rr(-w / 2, -h / 2, w, h, 16); g.fill();
  g.beginPath(); g.moveTo(-12, h / 2 - 1); g.lineTo(12, h / 2 - 1); g.lineTo(0, h / 2 + 15); g.fill();
  if (star) drawStar(-w / 2 + 34, 0, 15, tcol);
  text(label, star ? 20 : 0, 2, 800, 34, tcol);
  g.restore();
}
function drawStar(x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(x + q * Math.cos(a), y + q * Math.sin(a)); }
  g.fill();
}

// ---------- globo do sorteio ----------
function drum(x, y, pop, t, c) {
  if (pop <= 0) return;
  g.save(); g.translate(x, y); g.scale(back(pop), back(pop));
  g.fillStyle = '#0A0E1C'; g.beginPath(); g.moveTo(-58, 132); g.lineTo(58, 132); g.lineTo(26, 84); g.lineTo(-26, 84); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.beginPath(); g.arc(0, 0, 96, 0, 7); g.fill();
  const r = rnd(5);
  for (let i = 0; i < 14; i++) {
    const a0 = r() * 6.28, rad = 22 + r() * 56, sp = (1.8 + r() * 2.4) * (i % 2 ? 1 : -1), a = a0 + t * sp;
    const bx = Math.cos(a) * rad, by = Math.sin(a * 1.3 + i) * rad * 0.9;
    g.fillStyle = i % 3 ? '#F4EFE6' : c; g.beginPath(); g.arc(bx, by, 15, 0, 7); g.fill();
  }
  g.strokeStyle = GOLD; g.lineWidth = 8; g.beginPath(); g.arc(0, 0, 96, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, 78, 3.5, 4.5); g.stroke();
  g.restore();
}
function ball(x0, y0, p, u, label) {   // voa do globo até acima do corredor p
  if (u <= 0) return;
  const k = eo(u), x1 = p.x + 8, y1 = p.y - 300 * p.s, x = mix(x0, x1, k), y = mix(y0, y1, k) - 170 * Math.sin(Math.PI * k), r = mix(16, 44, k);
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.arc(x + 3, y + 5, r, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = GOLD; g.lineWidth = 6; g.stroke();
  if (k > 0.5) text(label, x, y + 2, 800, 36, INK);
}

// ---------- confete e cartão ----------
function confetti(x, y, t0, t) {
  const u = t - t0; if (u < 0 || u > 2.2) return;
  const r = rnd(31);
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2.6, v = 500 + r() * 900, cx = x + Math.cos(a) * v * u * 0.75, cy = y + Math.sin(a) * v * u + 900 * u * u, rot = r() * 6 + u * (4 + r() * 8);
    g.save(); g.translate(cx, cy); g.rotate(rot); g.globalAlpha = clamp(2.2 - u) * 0.95;
    g.fillStyle = [GOLD, '#fff', '#2EC4B6', '#FF6B5B', '#6C9BFF'][i % 5]; g.fillRect(-9, -5, 18, 10 * Math.cos(rot * 1.7)); g.restore();
  }
}
function winCard(t0, t, c) {
  const u = t - t0; if (u < 0) return;
  const k = back(u / 0.45), w = 700, h = 170;
  g.save(); g.translate(540, 690); g.scale(k, k); g.globalAlpha = clamp(u * 6);
  g.fillStyle = 'rgba(0,0,0,0.4)'; rr(-w / 2 + 6, -h / 2 + 10, w, h, 30); g.fill();
  g.fillStyle = CREAM; rr(-w / 2, -h / 2, w, h, 30); g.fill();
  g.fillStyle = c; rr(-w / 2, -h / 2, 22, h, [30, 0, 0, 30]); g.fill();
  g.fillStyle = '#17A673'; g.beginPath(); g.arc(-w / 2 + 104, 0, 46, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
  const ck = clamp((u - 0.2) / 0.3);
  g.beginPath(); g.moveTo(-w / 2 + 84, 2); g.lineTo(-w / 2 + 84 + 14 * Math.min(1, ck * 2), 2 + 16 * Math.min(1, ck * 2));
  if (ck > 0.5) g.lineTo(-w / 2 + 98 + 28 * (ck - 0.5) * 2, 18 - 34 * (ck - 0.5) * 2); g.stroke();
  text('CONTEMPLADO!', -w / 2 + 176, -24, 900, 58, INK, 'left', 0.5);
  text('Carta de crédito na mão', -w / 2 + 178, 36, 600, 32, '#4A4F5E', 'left');
  g.restore();
}

// ---------- interface ----------
function tabs(active, a) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  const ws = LANES.map(L => tw(L.tab, 800, 27, 1.5) + 50), gap = 14, tot = ws.reduce((x, y) => x + y) + gap * 3;
  let x = (W - tot) / 2;
  LANES.forEach((L, i) => {
    const on = i === active;
    if (on) { g.fillStyle = L.c; rr(x, 246, ws[i], 58, 29); g.fill(); }
    else { g.strokeStyle = 'rgba(244,239,230,0.28)'; g.lineWidth = 2.5; rr(x, 246, ws[i], 58, 29); g.stroke(); }
    text(L.tab, x + ws[i] / 2, 276, 800, 27, on ? INK : (i < active ? 'rgba(244,239,230,0.75)' : 'rgba(244,239,230,0.45)'), 'center', 1.5);
    x += ws[i] + gap;
  });
  g.restore();
}
function fitText(s, x, y, wt, px, col, maxW, ls = 0) { const w = tw(s, wt, px, ls); if (w > maxW) px = px * maxW / w; text(s, x, y, wt, px, col, 'center', ls); }
function laneTitle(i, t, t0, a) {
  const L = LANES[i], u1 = eo(seg(t, t0, t0 + 0.45)), u2 = eo(seg(t, t0 + 0.12, t0 + 0.6));

    chunks.push(cur);

  for (let i = 0; i < n; i++) out.push({
    wx: xs[i], d: ds[i], ph: r() * 6.28, cad: 0.94 + r() * 0.12,
    shirt: SHIRTS[(i * 2 + seed) % SHIRTS.length], skin: SKINS[Math.floor(r() * SKINS.length)], hair: HAIRS[Math.floor(r() * HAIRS.length)],
    bib: String(10 + Math.floor(r() * 89))

}

const runT = t => scroll(t) / V;
function drawPack(list, t, fn) {
  const rt = runT(t), amp = clamp(speedAt(t) / V, 0, 1);
  const items = list.map((r, i) => { const st = fn ? fn(r, i) : {}; return { r, i, st, d: st.d ?? r.d }; }).sort((a, b) => b.d - a.d);
  const pos = [];

    const { r, st } = it, a2 = st.amp ?? amp;
    pos[it.i] = runner(st.wx ?? r.wx, it.d, r.ph + rt * 15.5 * r.cad + (st.extraPh || 0), Math.max(a2, st.cheer ? 0.05 : 0), { ...r, ...st });

}
function fade(t, sc) { return eio(seg(t, sc.s, sc.s + 0.35)) * (1 - eio(seg(t, sc.e - 0.3, sc.e))); }
// posição do vencedor: dispara até a linha e cruza
function winnerX(t, sc, x0, tGo) {

}

window.renderAt = function (t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  background(t);
  const s = TL.scenes;
  if (t < s.intro.e) sceneIntro(t);
  else if (t < s.sorteio.e) sceneSorteio(t);
  else if (t < s.livre.e) sceneLivre(t);
  else if (t < s.fixo.e) sceneFixo(t);
  else if (t < s.fidelidade.e) sceneFidelidade(t);
  else sceneEnd(t);
  captions(t);
