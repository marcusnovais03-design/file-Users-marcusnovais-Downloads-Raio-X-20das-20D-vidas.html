<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Anthropic x PIB</title><style>
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1350px;overflow:hidden;background:#070d24;font-family:"Inter",sans-serif;color:#fff}
.bg{position:absolute;inset:0} .bg img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.05)}
.me{position:absolute;left:50%;top:-20px;width:720px;transform:translateX(-50%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,13,36,0) 0%,rgba(7,13,36,0) 34%,rgba(7,13,36,.85) 45%,#070d24 52%,#070d24 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:54px 54px}
.pg{position:absolute;left:80px;right:80px;top:585px}
.pill{display:inline-block;background:#e3b65a;color:#070d24;font-weight:800;font-size:23px;letter-spacing:.12em;text-transform:uppercase;padding:11px 26px;border-radius:40px;margin-bottom:22px}
h1{font-family:"Inter Display","Inter",sans-serif;font-weight:900;text-transform:uppercase;font-size:64px;line-height:1.04;letter-spacing:-.05em;word-spacing:.1em}
h1 em{font-style:normal;color:#e3b65a}
.sub{font-size:29px;line-height:1.25;color:rgba(255,255,255,.85);margin-top:16px}
.bars{display:flex;align-items:flex-end;gap:34px;height:250px;margin-top:22px;border-bottom:4px solid rgba(255,255,255,.7)}
.b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.b .v{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:48px;letter-spacing:-.04em;margin-bottom:10px;white-space:nowrap}
.b .v small{font-size:28px;letter-spacing:0}
.b .r{width:100%;border-radius:20px 20px 0 0}
.lab{display:flex;gap:34px;margin-top:12px}
.lab div{flex:1;text-align:center;font-size:25px;font-weight:700;line-height:1.15}
.lab div span{display:block;font-size:22px;font-weight:500;color:rgba(255,255,255,.65);margin-top:4px}
.ft{position:absolute;left:80px;right:80px;bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;font-size:18px;color:rgba(255,255,255,.6)}
.ft b{font-size:28px;color:rgba(255,255,255,.85);font-weight:800}
.row{display:flex;align-items:center;gap:40px;margin-top:34px}
.ring{width:300px;height:300px;flex:none}
.cmp{flex:1}
.it{margin-bottom:26px}
.it span{display:block;font-size:27px;font-weight:700;color:rgba(255,255,255,.85)}
.it b{display:block;font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:58px;letter-spacing:-.04em;margin:2px 0 10px}
.it i{display:block;height:26px;border-radius:13px;background:rgba(255,255,255,.1);overflow:hidden}
.it u{display:block;height:100%;border-radius:13px}
.sub b{color:#e3b65a}
</style></head><body>
<div class="bg"><img src="foto.png" style="filter:blur(20px) brightness(.5)"></div><img class="me" src="foto.png"><div class="sh"></div><div class="grid"></div>
<div class="pg"><div class="pill">Tecnologia x economia</div>
<h1>Uma empresa de tecnologia vale <em>62% do PIB</em> do Brasil</h1>
<div class="row">
 <svg viewBox="0 0 300 300" class="ring"><circle cx="150" cy="150" r="118" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="44"/>
 <circle cx="150" cy="150" r="118" fill="none" stroke="#e3b65a" stroke-width="44" stroke-dasharray="457.5 1000" transform="rotate(-90 150 150)"/>
 <text x="150" y="168" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="74" fill="#fff" letter-spacing="-3">62%</text></svg>
 <div class="cmp">
  <div class="it"><span>PIB do Brasil em 2025</span><b style="color:#b9bdcc">US$ 2,27 tri</b><i><u style="width:100%;background:#b9bdcc"></u></i></div>
  <div class="it"><span>Anthropic, dona do Claude</span><b style="color:#e3b65a">US$ 1,4 tri</b><i><u style="width:61.7%;background:#e3b65a"></u></i></div>
 </div>
</div>
</div>
<div class="ft"><div>Fontes: PIB 2025 IBGE (R$ 12,7 tri), em dólar pela Austin Rating.<br>Anthropic: valor de mercado divulgado na estreia na Nasdaq.</div><b>@mnovais</b></div>
</body></html>
